# Render blueprint. Secret values stay in the Render dashboard, not in this file.
# The service name sets the public address, https://as20593-medfinder.onrender.com.
# prototype/config.js sends the GitHub Pages copy of the app to that address, so keep them the same.
# Preview environments for pull requests need a paid Render workspace, so they are off.
# If Render asks for payment or a paid add-on, stop and ask before turning it on.

services:
  - type: web
    name: as20593-medfinder
    runtime: node
    plan: free
    branch: main
    buildCommand: node scripts/migrate.js
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MEDFINDER_DATABASE
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: perplexity/sonar
      - key: OPENROUTER_EXTRACT_MODEL
        value: google/gemini-2.5-flash
      - key: OPENROUTER_CHAT_MODEL
        value: google/gemini-2.5-flash
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

previews:
  generation: off
